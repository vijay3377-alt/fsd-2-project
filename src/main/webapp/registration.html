<!DOCTYPE html>
<html>

<head>

    <title>User Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>User Registration</h2>

    <form action="register" method="post">

        <label>Full Name</label>

        <input
                type="text"
                name="fullname"
                placeholder="Enter your full name"
                required
        >

        <label>Email</label>

        <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
        >

        <label>Phone</label>

        <input
                type="text"
                name="phone"
                placeholder="Enter your phone number"
                required
        >

        <label>Password</label>

        <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
        >

        <label>Gender</label>

        <select name="gender" required>

            <option value="">Select Gender</option>

            <option value="Male">Male</option>

            <option value="Female">Female</option>

            <option value="Other">Other</option>

        </select>

        <label>Address</label>

        <textarea
                name="address"
                placeholder="Enter your address"
                rows="4"
                required>
        </textarea>

        <button type="submit">
            Register
        </button>

    </form>

</div>

</body>

</html>
